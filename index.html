<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redcliffe Labs — Event Intelligence & Outreach</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── Variables ───────────────────────────────────────────── */
    :root {
      --bg:            #f0f4f8;
      --surface:       #ffffff;
      --surface-2:     #f8fafc;
      --border:        #e2e8f0;
      --primary:       #2563eb;
      --primary-light: #dbeafe;
      --primary-hover: #1d4ed8;
      --accent:        #0ea5e9;
      --coral:         #f97316;
      --coral-bg:      #fff7ed;
      --coral-border:  #fed7aa;
      --success:       #10b981;
      --text:          #1e293b;
      --text-2:        #475569;
      --text-3:        #94a3b8;
      --shadow-sm:     0 1px 2px rgba(0,0,0,.05);
      --shadow:        0 2px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
      --shadow-md:     0 8px 24px rgba(0,0,0,.10);
      --radius:        14px;
      --radius-sm:     8px;
      --radius-xs:     6px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:            #0f172a;
        --surface:       #1e293b;
        --surface-2:     #0f172a;
        --border:        #334155;
        --primary:       #3b82f6;
        --primary-light: #1e3a5f;
        --primary-hover: #2563eb;
        --coral:         #fb923c;
        --coral-bg:      #431407;
        --coral-border:  #7c3400;
        --success:       #34d399;
        --text:          #f1f5f9;
        --text-2:        #94a3b8;
        --text-3:        #475569;
        --shadow:        0 2px 8px rgba(0,0,0,.35);
        --shadow-md:     0 8px 24px rgba(0,0,0,.45);
      }
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── App Shell ───────────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 13px;
      letter-spacing: -.5px; flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-sub   { font-size: 12px; color: var(--text-3); }

    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    /* ── Progress Bar ────────────────────────────────────────── */
    .progress-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
    }
    .step-node {
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap;
    }
    .step-circle {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      transition: all .2s;
    }
    .step-circle.done    { background: var(--success); color: white; }
    .step-circle.active  { background: var(--primary); color: white;
                           box-shadow: 0 0 0 4px var(--primary-light); }
    .step-circle.pending { background: var(--surface-2); color: var(--text-3);
                           border: 2px solid var(--border); }
    .step-label          { font-size: 13px; font-weight: 500; }
    .step-label.done     { color: var(--success); }
    .step-label.active   { color: var(--primary); }
    .step-label.pending  { color: var(--text-3); }
    .step-line {
      flex: 1; height: 2px; background: var(--border); margin: 0 10px; min-width: 16px;
    }
    .step-line.done { background: var(--success); }

    /* ── Panel ───────────────────────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .panel-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .panel-sub   { font-size: 14px; color: var(--text-2); margin-bottom: 24px; }

    /* ── Fields ──────────────────────────────────────────────── */
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--text-3); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 8px;
    }
    .field-wrap { margin-bottom: 20px; }
    .text-input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--text);
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .15s;
    }
    .text-input:focus { border-color: var(--primary); background: var(--surface); }
    .text-input::placeholder { color: var(--text-3); }
    select.text-input { cursor: pointer; }

    /* ── Pills ───────────────────────────────────────────────── */
    .pills-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .pill {
      padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight: 500;
      border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text-2); cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .pill:hover    { border-color: var(--primary); color: var(--primary);
                     background: var(--primary-light); }
    .pill.selected { border-color: var(--primary); background: var(--primary); color: white; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; border: none; transition: all .15s; outline: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-outline  { background: transparent; color: var(--primary);
                    border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    .btn-ghost    { background: var(--surface-2); color: var(--text-2);
                    border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    .btn-sm { padding: 7px 14px; font-size: 13px; }
    .btn-row { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

    /* ── Error ───────────────────────────────────────────────── */
    .error-alert {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-sm);
      padding: 10px 14px; font-size: 13px; color: #b91c1c; margin-bottom: 16px;
    }
    @media (prefers-color-scheme: dark) {
      .error-alert { background: #1f0e0e; border-color: #7f1d1d; color: #fca5a5; }
    }

    /* ── Section Title ───────────────────────────────────────── */
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px;
    }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner-wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 44px 0;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { font-size: 14px; color: var(--text-2); }

    /* ── Event Cards ─────────────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px; margin-bottom: 4px;
    }
    .event-card {
      border: 2px solid var(--border); border-radius: var(--radius);
      padding: 18px; cursor: pointer; transition: all .15s;
      background: var(--surface); position: relative;
    }
    .event-card:hover    { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .event-card.selected { border-color: var(--primary); background: var(--primary-light);
                           box-shadow: 0 0 0 1px var(--primary); }
    .event-card-badge {
      position: absolute; top: 12px; right: 12px;
      background: var(--primary); color: white; border-radius: 999px;
      padding: 2px 10px; font-size: 11px; font-weight: 600; display: none;
    }
    .event-card.selected .event-card-badge { display: block; }
    .event-card-name {
      font-size: 14px; font-weight: 700; margin-bottom: 10px;
      padding-right: 72px; line-height: 1.35;
    }
    .event-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .meta-chip {
      font-size: 11px; color: var(--text-2); background: var(--surface-2);
      border: 1px solid var(--border); padding: 2px 8px;
      border-radius: 999px;
    }
    .event-agenda { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
    .event-panels { display: flex; flex-direction: column; gap: 5px; }
    .panel-tag {
      font-size: 11px; color: var(--accent); font-weight: 500;
      background: rgba(14,165,233,.1); border: 1px solid rgba(14,165,233,.3);
      padding: 3px 10px; border-radius: 4px; display: inline-block;
    }
    /* ── Manual Add Box ─────────────────────────────────────── */
    .manual-box {
      background: var(--surface-2); border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm); padding: 16px; margin-bottom: 16px;
    }
    .manual-box .field-label { margin-bottom: 10px; }
    .divider-label {
      text-align: center; font-size: 11px; color: var(--text-3);
      font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      margin: 16px 0; position: relative;
    }
    .divider-label::before, .divider-label::after {
      content: ""; position: absolute; top: 50%;
      width: 38%; height: 1px; background: var(--border);
    }
    .divider-label::before { left: 0; }
    .divider-label::after  { right: 0; }

    /* ── Mode Toggle ─────────────────────────────────────────── */
    .mode-toggle {
      display: flex; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 3px; gap: 3px; margin-bottom: 20px; width: fit-content;
    }
    .mode-btn {
      padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600;
      font-family: inherit; border: none; cursor: pointer;
      background: transparent; color: var(--text-3); transition: all .15s;
    }
    .mode-btn.active {
      background: var(--surface); color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .info-note {
      font-size: 12px; color: var(--primary); background: var(--primary-light);
      border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent);
      border-radius: var(--radius-xs); padding: 8px 12px; margin-bottom: 18px;
    }
    .live-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: #dcfce7; color: #15803d; border: 1px solid #86efac;
      border-radius: 999px; padding: 2px 9px;
      font-size: 11px; font-weight: 600; margin-bottom: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .live-badge { background: #052e16; color: #4ade80; border-color: #166534; }
    }

    .ref-link {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 10px; font-size: 11px; font-weight: 600;
      color: var(--success); text-decoration: none;
      border: 1px solid var(--success); border-radius: 4px;
      padding: 3px 10px; transition: all .15s;
      background: rgba(16,185,129,.08);
    }
    .ref-link:hover { background: rgba(16,185,129,.18); }

    /* ── Recap Panel ─────────────────────────────────────────── */
    .recap-btn {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 8px; margin-left: 6px; font-size: 11px; font-weight: 600;
      color: #6366f1; border: 1px solid #6366f1; border-radius: 4px;
      padding: 3px 10px; transition: all .15s; cursor: pointer;
      background: rgba(99,102,241,.08); font-family: inherit;
    }
    .recap-btn:hover   { background: rgba(99,102,241,.18); }
    .recap-btn:disabled { opacity: .5; cursor: not-allowed; }
    .recap-panel {
      margin-top: 10px; padding: 12px 14px;
      background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.25);
      border-radius: var(--radius-sm); font-size: 12px;
    }
    .recap-confirmed   { color: var(--success); font-weight: 700; margin-bottom: 6px; }
    .recap-unconfirmed { color: var(--coral);   font-weight: 700; margin-bottom: 6px; }
    .recap-themes { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 8px; }
    .recap-theme-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3);
      color: #6366f1; font-weight: 500;
    }
    .recap-text { color: var(--text-2); line-height: 1.55; margin-bottom: 4px; }

    /* ── People Cards ────────────────────────────────────────── */
    .people-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 14px; margin-bottom: 4px;
    }
    .person-card {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 18px; background: var(--surface);
      display: flex; align-items: flex-start; gap: 12px;
      transition: box-shadow .15s;
    }
    .person-card:hover { box-shadow: var(--shadow-md); }
    .avatar {
      width: 42px; height: 42px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .person-name    { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .person-title   { font-size: 12px; color: var(--text-2); margin-bottom: 3px; }
    .person-company { font-size: 12px; color: var(--primary); font-weight: 500; margin-bottom: 7px; }
    .person-topic-tag {
      font-size: 11px; color: var(--text-3);
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 4px; display: inline-block;
    }
    .person-email {
      font-size: 11px; color: var(--text-3); margin-top: 5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ── Source Links Box ───────────────────────────────────── */
    .source-box {
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 14px 16px; margin-top: 20px; background: var(--surface-2);
    }
    .source-box-title {
      font-size: 11px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
    }
    .source-link {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      text-decoration: none; transition: background .1s;
    }
    .source-link:last-child { border-bottom: none; padding-bottom: 0; }
    .source-link:hover .source-link-title { color: var(--primary); }
    .source-link-num {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .source-link-title {
      font-size: 13px; font-weight: 500; color: var(--text);
      display: block; line-height: 1.3; margin-bottom: 2px;
    }
    .source-link-url {
      font-size: 11px; color: var(--text-3);
      display: block; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; max-width: 400px;
    }

    /* ── Insight Cards ───────────────────────────────────────── */
    .insight-card {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 20px; background: var(--surface); margin-bottom: 14px;
    }
    .insight-card-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }
    .pain-points { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .pain-badge {
      font-size: 12px; font-weight: 500; color: var(--coral);
      background: var(--coral-bg); border: 1px solid var(--coral-border);
      padding: 4px 12px; border-radius: 999px;
    }
    .hook-box {
      background: var(--surface-2); border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
      padding: 10px 14px; font-size: 13px; color: var(--text-2);
      font-style: italic; margin-bottom: 10px; line-height: 1.55;
    }
    .opportunity-label {
      font-size: 11px; font-weight: 700; color: var(--success);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px;
    }
    .opportunity-text { font-size: 12px; color: var(--text-3); line-height: 1.55; }

    /* ── Email Output ────────────────────────────────────────── */
    .email-output {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      overflow: hidden; margin-top: 22px;
    }
    .email-header-row {
      background: var(--surface-2); border-bottom: 1px solid var(--border);
      padding: 11px 18px; display: flex; align-items: baseline; gap: 10px;
    }
    .email-field-label {
      font-size: 11px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .04em;
      min-width: 58px; flex-shrink: 0;
    }
    .email-field-value         { font-size: 14px; color: var(--text); }
    .email-field-value.subject { font-weight: 600; }
    .email-body-wrap  { padding: 20px; }
    .email-body-text  {
      font-family: inherit; font-size: 14px; color: var(--text);
      white-space: pre-wrap; line-height: 1.75;
    }
    .email-actions {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-top: 1px solid var(--border);
      background: var(--surface-2);
    }

    /* ── Bulk Send ───────────────────────────────────────────── */
    .bulk-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:12px; }
    .bulk-table th {
      text-align:left; font-size:11px; font-weight:700; color:var(--text-3);
      text-transform:uppercase; letter-spacing:.05em;
      padding:6px 10px; border-bottom:2px solid var(--border);
    }
    .bulk-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
    .bulk-table tr:last-child td { border-bottom:none; }
    .status-dot {
      display:inline-flex; align-items:center; gap:5px;
      font-size:12px; font-weight:600;
    }
    .status-dot.sent    { color:var(--success); }
    .status-dot.error   { color:#b91c1c; }
    .status-dot.skipped { color:var(--text-3); }
    .status-dot.pending { color:var(--text-3); }
    .attach-label {
      display:flex; align-items:center; gap:8px; cursor:pointer;
      padding:9px 14px; border:1.5px dashed var(--border);
      border-radius:var(--radius-sm); font-size:13px; color:var(--text-2);
      transition:border-color .15s;
    }
    .attach-label:hover { border-color:var(--primary); color:var(--primary); }
    .attach-chosen { color:var(--success); font-size:12px; margin-top:5px; }
    .test-badge {
      display:inline-flex; align-items:center; gap:5px;
      background:#fefce8; border:1px solid #fde047; border-radius:999px;
      padding:3px 10px; font-size:11px; font-weight:600; color:#854d0e;
    }
    @media (prefers-color-scheme:dark) {
      .test-badge { background:#422006; border-color:#a16207; color:#fde047; }
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 640px) {
      .main         { padding: 14px 12px 48px; }
      .panel        { padding: 18px 14px; }
      .cards-grid   { grid-template-columns: 1fr; }
      .people-grid  { grid-template-columns: 1fr; }
      .progress-wrap{ overflow-x: auto; padding: 14px 16px; }
      .step-label   { display: none; }
      .header       { padding: 12px 14px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
/* ── Constants ─────────────────────────────────────────────── */
const CATEGORIES = [
  "HR & People Leadership",
  "Corporate Business",
  "Healthcare & Diagnostics",
  "CHRO & CXO Summit",
  "Startup & VC",
];

const PITCH_ANGLES = [
  "I attended the same event",
  "I heard your panel session",
  "We met briefly at the event",
  "I saw your talk on the topic",
];

const AVATAR_COLORS = ["#6366f1","#0ea5e9","#10b981","#f59e0b","#ec4899"];

const STEPS = ["Scan Events","People","Insights"];

/* ── OpenAI key (per-browser, never sent to anyone but our own server) ── */
const OPENAI_KEY_STORAGE = "redcliffe_openai_key";
function getOpenAIKey() {
  return localStorage.getItem(OPENAI_KEY_STORAGE) || "";
}
function setOpenAIKey(key) {
  if (key) localStorage.setItem(OPENAI_KEY_STORAGE, key);
  else localStorage.removeItem(OPENAI_KEY_STORAGE);
}

/* ── Utilities ─────────────────────────────────────────────── */
function parseJSON(text) {
  const clean = text
    .replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/```\s*$/i,"").trim();
  return JSON.parse(clean);
}

function getInitials(name) {
  return name.split(" ").map(w => w[0]).slice(0,2).join("").toUpperCase();
}

function downloadRows(headers, rows, filename) {
  const escape = v => `"${(v || "").toString().replace(/"/g, '""')}"`;
  const csv = [headers, ...rows].map(r => r.map(escape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadCSV(people, eventName) {
  const headers = ["Name", "Position", "Company", "Topic / Session", "Email Hint"];
  const rows = people.map(p => [p.name, p.title, p.company, p.topic || "", p.email_hint || ""]);
  downloadRows(headers, rows, `${eventName.replace(/[^a-z0-9]/gi, "_").toLowerCase()}_speakers.csv`);
}

function downloadInsightsCSV(people, insights, eventName) {
  const insightMap = Object.fromEntries(insights.map(ins => [ins.id, ins]));
  const headers = [
    "Name", "Position", "Company", "Topic / Session", "Email Hint",
    "Event Status", "Speaking Topic", "What They Said", "Pain Points", "Hook", "Opportunity",
  ];
  const rows = people.map(p => {
    const ins = insightMap[p.id] || {};
    return [
      p.name, p.title, p.company, p.topic || "", p.email_hint || "",
      ins.event_status || "", ins.speaking_topic || "", ins.what_they_said || "",
      (ins.pain_points || []).join(" | "), ins.hook || "", ins.opportunity || "",
    ];
  });
  downloadRows(headers, rows, `${eventName.replace(/[^a-z0-9]/gi, "_").toLowerCase()}_insights.csv`);
}

  return (
    <div>
      <header className="header">
        <div className="header-logo">RL</div>
        <div>
          <div className="header-title">Redcliffe Labs — Event Intelligence</div>
          <div className="header-sub">AI-powered corporate outreach pipeline</div>
        </div>
        <OpenAIKeyField />
      </header>

      <main className="main">
        <ProgressBar current={step} />

        {step === 0 && (
          <Step1 onNext={ev => { setEvent(ev); setStep(1); }} />
        )}
        {step === 1 && event && (
          <Step2
            event={event}
            onNext={pp => { setPeople(pp); setStep(2); }}
            onBack={() => setStep(0)}
          />
        )}
        {step === 2 && event && people.length > 0 && (
          <Step3
            event={event}
            people={people}
            onBack={() => setStep(1)}
          />
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
