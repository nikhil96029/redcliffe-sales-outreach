<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redcliffe Labs — Event Intelligence & Outreach</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* ── Variables ───────────────────────────────────────────── */
    :root {
      --bg:            #f0f4f8;
      --surface:       #ffffff;
      --surface-2:     #f8fafc;
      --border:        #e2e8f0;
      --primary:       #2563eb;
      --primary-light: #dbeafe;
      --primary-hover: #1d4ed8;
      --accent:        #0ea5e9;
      --coral:         #f97316;
      --coral-bg:      #fff7ed;
      --coral-border:  #fed7aa;
      --success:       #10b981;
      --text:          #1e293b;
      --text-2:        #475569;
      --text-3:        #94a3b8;
      --shadow-sm:     0 1px 2px rgba(0,0,0,.05);
      --shadow:        0 2px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
      --shadow-md:     0 8px 24px rgba(0,0,0,.10);
      --radius:        14px;
      --radius-sm:     8px;
      --radius-xs:     6px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:            #0f172a;
        --surface:       #1e293b;
        --surface-2:     #0f172a;
        --border:        #334155;
        --primary:       #3b82f6;
        --primary-light: #1e3a5f;
        --primary-hover: #2563eb;
        --coral:         #fb923c;
        --coral-bg:      #431407;
        --coral-border:  #7c3400;
        --success:       #34d399;
        --text:          #f1f5f9;
        --text-2:        #94a3b8;
        --text-3:        #475569;
        --shadow:        0 2px 8px rgba(0,0,0,.35);
        --shadow-md:     0 8px 24px rgba(0,0,0,.45);
      }
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── App Shell ───────────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 13px;
      letter-spacing: -.5px; flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-sub   { font-size: 12px; color: var(--text-3); }

    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    /* ── Progress Bar ────────────────────────────────────────── */
    .progress-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
    }
    .step-node {
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap;
    }
    .step-circle {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      transition: all .2s;
    }
    .step-circle.done    { background: var(--success); color: white; }
    .step-circle.active  { background: var(--primary); color: white;
                           box-shadow: 0 0 0 4px var(--primary-light); }
    .step-circle.pending { background: var(--surface-2); color: var(--text-3);
                           border: 2px solid var(--border); }
    .step-label          { font-size: 13px; font-weight: 500; }
    .step-label.done     { color: var(--success); }
    .step-label.active   { color: var(--primary); }
    .step-label.pending  { color: var(--text-3); }
    .step-line {
      flex: 1; height: 2px; background: var(--border); margin: 0 10px; min-width: 16px;
    }
    .step-line.done { background: var(--success); }

    /* ── Panel ───────────────────────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .panel-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .panel-sub   { font-size: 14px; color: var(--text-2); margin-bottom: 24px; }

    /* ── Fields ──────────────────────────────────────────────── */
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--text-3); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 8px;
    }
    .field-wrap { margin-bottom: 20px; }
    .text-input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--text);
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .15s;
    }
    .text-input:focus { border-color: var(--primary); background: var(--surface); }
    .text-input::placeholder { color: var(--text-3); }
    select.text-input { cursor: pointer; }

    /* ── Pills ───────────────────────────────────────────────── */
    .pills-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .pill {
      padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight: 500;
      border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text-2); cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .pill:hover    { border-color: var(--primary); color: var(--primary);
                     background: var(--primary-light); }
    .pill.selected { border-color: var(--primary); background: var(--primary); color: white; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; border: none; transition: all .15s; outline: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-outline  { background: transparent; color: var(--primary);
                    border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    .btn-ghost    { background: var(--surface-2); color: var(--text-2);
                    border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    .btn-sm { padding: 7px 14px; font-size: 13px; }
    .btn-row { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

    /* ── Error ───────────────────────────────────────────────── */
    .error-alert {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-sm);
      padding: 10px 14px; font-size: 13px; color: #b91c1c; margin-bottom: 16px;
    }
    @media (prefers-color-scheme: dark) {
      .error-alert { background: #1f0e0e; border-color: #7f1d1d; color: #fca5a5; }
    }

    /* ── Section Title ───────────────────────────────────────── */
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px;
    }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner-wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 44px 0;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { font-size: 14px; color: var(--text-2); }

    /* ── Event Cards ─────────────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px; margin-bottom: 4px;
    }
    .event-card {
      border: 2px solid var(--border); border-radius: var(--radius);
      padding: 18px; cursor: pointer; transition: all .15s;
      background: var(--surface); position: relative;
    }
    .event-card:hover    { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .event-card.selected { border-color: var(--primary); background: var(--primary-light);
                           box-shadow: 0 0 0 1px var(--primary); }
    .event-card-badge {
      position: absolute; top: 12px; right: 12px;
      background: var(--primary); color: white; border-radius: 999px;
      padding: 2px 10px; font-size: 11px; font-weight: 600; display: none;
    }
    .event-card.selected .event-card-badge { display: block; }
    .event-card-name {
      font-size: 14px; font-weight: 700; margin-bottom: 10px;
      padding-right: 72px; line-height: 1.35;
    }
    .event-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .meta-chip {
      font-size: 11px; color: var(--text-2); background: var(--surface-2);
      border: 1px solid var(--border); padding: 2px 8px;
      border-radius: 999px;
    }
    .event-agenda { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
    .event-panels { display: flex; flex-direction: column; gap: 5px; }
    .panel-tag {
      font-size: 11px; color: var(--accent); font-weight: 500;
      background: rgba(14,165,233,.1); border: 1px solid rgba(14,165,233,.3);
      padding: 3px 10px; border-radius: 4px; display: inline-block;
    }
    /* ── Manual Add Box ─────────────────────────────────────── */
    .manual-box {
      background: var(--surface-2); border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm); padding: 16px; margin-bottom: 16px;
    }
    .manual-box .field-label { margin-bottom: 10px; }
    .divider-label {
      text-align: center; font-size: 11px; color: var(--text-3);
      font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      margin: 16px 0; position: relative;
    }
    .divider-label::before, .divider-label::after {
      content: ""; position: absolute; top: 50%;
      width: 38%; height: 1px; background: var(--border);
    }
    .divider-label::before { left: 0; }
    .divider-label::after  { right: 0; }

    /* ── Mode Toggle ─────────────────────────────────────────── */
    .mode-toggle {
      display: flex; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 3px; gap: 3px; margin-bottom: 20px; width: fit-content;
    }
    .mode-btn {
      padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600;
      font-family: inherit; border: none; cursor: pointer;
      background: transparent; color: var(--text-3); transition: all .15s;
    }
    .mode-btn.active {
      background: var(--surface); color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .info-note {
      font-size: 12px; color: var(--primary); background: var(--primary-light);
      border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent);
      border-radius: var(--radius-xs); padding: 8px 12px; margin-bottom: 18px;
    }
    .live-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: #dcfce7; color: #15803d; border: 1px solid #86efac;
      border-radius: 999px; padding: 2px 9px;
      font-size: 11px; font-weight: 600; margin-bottom: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .live-badge { background: #052e16; color: #4ade80; border-color: #166534; }
    }

    .ref-link {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 10px; font-size: 11px; font-weight: 600;
      color: var(--success); text-decoration: none;
      border: 1px solid var(--success); border-radius: 4px;
      padding: 3px 10px; transition: all .15s;
      background: rgba(16,185,129,.08);
    }
    .ref-link:hover { background: rgba(16,185,129,.18); }

    /* ── Recap Panel ─────────────────────────────────────────── */
    .recap-btn {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 8px; margin-left: 6px; font-size: 11px; font-weight: 600;
      color: #6366f1; border: 1px solid #6366f1; border-radius: 4px;
      padding: 3px 10px; transition: all .15s; cursor: pointer;
      background: rgba(99,102,241,.08); font-family: inherit;
    }
    .recap-btn:hover   { background: rgba(99,102,241,.18); }
    .recap-btn:disabled { opacity: .5; cursor: not-allowed; }
    .recap-panel {
      margin-top: 10px; padding: 12px 14px;
      background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.25);
      border-radius: var(--radius-sm); font-size: 12px;
    }
    .recap-confirmed   { color: var(--success); font-weight: 700; margin-bottom: 6px; }
    .recap-unconfirmed { color: var(--coral);   font-weight: 700; margin-bottom: 6px; }
    .recap-themes { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 8px; }
    .recap-theme-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3);
      color: #6366f1; font-weight: 500;
    }
    .recap-text { color: var(--text-2); line-height: 1.55; margin-bottom: 4px; }

    /* ── People Cards ────────────────────────────────────────── */
    .people-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 14px; margin-bottom: 4px;
    }
    .person-card {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 18px; background: var(--surface);
      display: flex; align-items: flex-start; gap: 12px;
      transition: box-shadow .15s;
    }
    .person-card:hover { box-shadow: var(--shadow-md); }
    .avatar {
      width: 42px; height: 42px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .person-name    { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .person-title   { font-size: 12px; color: var(--text-2); margin-bottom: 3px; }
    .person-company { font-size: 12px; color: var(--primary); font-weight: 500; margin-bottom: 7px; }
    .person-topic-tag {
      font-size: 11px; color: var(--text-3);
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 4px; display: inline-block;
    }
    .person-email {
      font-size: 11px; color: var(--text-3); margin-top: 5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ── Source Links Box ───────────────────────────────────── */
    .source-box {
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 14px 16px; margin-top: 20px; background: var(--surface-2);
    }
    .source-box-title {
      font-size: 11px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
    }
    .source-link {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      text-decoration: none; transition: background .1s;
    }
    .source-link:last-child { border-bottom: none; padding-bottom: 0; }
    .source-link:hover .source-link-title { color: var(--primary); }
    .source-link-num {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .source-link-title {
      font-size: 13px; font-weight: 500; color: var(--text);
      display: block; line-height: 1.3; margin-bottom: 2px;
    }
    .source-link-url {
      font-size: 11px; color: var(--text-3);
      display: block; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; max-width: 400px;
    }

    /* ── Insight Cards ───────────────────────────────────────── */
    .insight-card {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 20px; background: var(--surface); margin-bottom: 14px;
    }
    .insight-card-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }
    .pain-points { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .pain-badge {
      font-size: 12px; font-weight: 500; color: var(--coral);
      background: var(--coral-bg); border: 1px solid var(--coral-border);
      padding: 4px 12px; border-radius: 999px;
    }
    .hook-box {
      background: var(--surface-2); border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
      padding: 10px 14px; font-size: 13px; color: var(--text-2);
      font-style: italic; margin-bottom: 10px; line-height: 1.55;
    }
    .opportunity-label {
      font-size: 11px; font-weight: 700; color: var(--success);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px;
    }
    .opportunity-text { font-size: 12px; color: var(--text-3); line-height: 1.55; }

    /* ── Email Output ────────────────────────────────────────── */
    .email-output {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      overflow: hidden; margin-top: 22px;
    }
    .email-header-row {
      background: var(--surface-2); border-bottom: 1px solid var(--border);
      padding: 11px 18px; display: flex; align-items: baseline; gap: 10px;
    }
    .email-field-label {
      font-size: 11px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .04em;
      min-width: 58px; flex-shrink: 0;
    }
    .email-field-value         { font-size: 14px; color: var(--text); }
    .email-field-value.subject { font-weight: 600; }
    .email-body-wrap  { padding: 20px; }
    .email-body-text  {
      font-family: inherit; font-size: 14px; color: var(--text);
      white-space: pre-wrap; line-height: 1.75;
    }
    .email-actions {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-top: 1px solid var(--border);
      background: var(--surface-2);
    }

    /* ── Bulk Send ───────────────────────────────────────────── */
    .bulk-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:12px; }
    .bulk-table th {
      text-align:left; font-size:11px; font-weight:700; color:var(--text-3);
      text-transform:uppercase; letter-spacing:.05em;
      padding:6px 10px; border-bottom:2px solid var(--border);
    }
    .bulk-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
    .bulk-table tr:last-child td { border-bottom:none; }
    .status-dot {
      display:inline-flex; align-items:center; gap:5px;
      font-size:12px; font-weight:600;
    }
    .status-dot.sent    { color:var(--success); }
    .status-dot.error   { color:#b91c1c; }
    .status-dot.skipped { color:var(--text-3); }
    .status-dot.pending { color:var(--text-3); }
    .attach-label {
      display:flex; align-items:center; gap:8px; cursor:pointer;
      padding:9px 14px; border:1.5px dashed var(--border);
      border-radius:var(--radius-sm); font-size:13px; color:var(--text-2);
      transition:border-color .15s;
    }
    .attach-label:hover { border-color:var(--primary); color:var(--primary); }
    .attach-chosen { color:var(--success); font-size:12px; margin-top:5px; }
    .test-badge {
      display:inline-flex; align-items:center; gap:5px;
      background:#fefce8; border:1px solid #fde047; border-radius:999px;
      padding:3px 10px; font-size:11px; font-weight:600; color:#854d0e;
    }
    @media (prefers-color-scheme:dark) {
      .test-badge { background:#422006; border-color:#a16207; color:#fde047; }
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 640px) {
      .main         { padding: 14px 12px 48px; }
      .panel        { padding: 18px 14px; }
      .cards-grid   { grid-template-columns: 1fr; }
      .people-grid  { grid-template-columns: 1fr; }
      .progress-wrap{ overflow-x: auto; padding: 14px 16px; }
      .step-label   { display: none; }
      .header       { padding: 12px 14px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
/* ── Constants ─────────────────────────────────────────────── */
const CATEGORIES = [
  "HR & People Leadership",
  "Corporate Business",
  "Healthcare & Diagnostics",
  "CHRO & CXO Summit",
  "Startup & VC",
];

const PITCH_ANGLES = [
  "I attended the same event",
  "I heard your panel session",
  "We met briefly at the event",
  "I saw your talk on the topic",
];

const AVATAR_COLORS = ["#6366f1","#0ea5e9","#10b981","#f59e0b","#ec4899"];

// Replace with your own OAuth Client ID from Google Cloud Console (OAuth consent screen
// must include the gmail.send scope, and this page's origin must be an authorized JS origin).
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com";
const GOOGLE_CONFIGURED = !GOOGLE_CLIENT_ID.startsWith("YOUR_GOOGLE_CLIENT_ID");

const STEPS = ["Scan Events","People","Insights","Email"];

/* ── OpenAI key (per-browser, never sent to anyone but our own server) ── */
const OPENAI_KEY_STORAGE = "redcliffe_openai_key";
function getOpenAIKey() {
  return localStorage.getItem(OPENAI_KEY_STORAGE) || "";
}
function setOpenAIKey(key) {
  if (key) localStorage.setItem(OPENAI_KEY_STORAGE, key);
  else localStorage.removeItem(OPENAI_KEY_STORAGE);
}

/* ── Utilities ─────────────────────────────────────────────── */
function parseJSON(text) {
  const clean = text
    .replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/```\s*$/i,"").trim();
  return JSON.parse(clean);
}

function getInitials(name) {
  return name.split(" ").map(w => w[0]).slice(0,2).join("").toUpperCase();
}

function downloadRows(headers, rows, filename) {
  const escape = v => `"${(v || "").toString().replace(/"/g, '""')}"`;
  const csv = [headers, ...rows].map(r => r.map(escape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadCSV(people, eventName) {
  const headers = ["Name", "Position", "Company", "Topic / Session", "Email Hint"];
  const rows = people.map(p => [p.name, p.title, p.company, p.topic || "", p.email_hint || ""]);
  downloadRows(headers, rows, `${eventName.replace(/[^a-z0-9]/gi, "_").toLowerCase()}_speakers.csv`);
}

function downloadInsightsCSV(people, insights, eventName) {
  const insightMap = Object.fromEntries(insights.map(ins => [ins.id, ins]));
  const headers = [
    "Name", "Position", "Company", "Topic / Session", "Email Hint",
    "Event Status", "Speaking Topic", "What They Said", "Pain Points", "Hook", "Opportunity",
  ];
  const rows = people.map(p => {
    const ins = insightMap[p.id] || {};
    return [
      p.name, p.title, p.company, p.topic || "", p.email_hint || "",
      ins.event_status || "", ins.speaking_topic || "", ins.what_they_said || "",
      (ins.pain_points || []).join(" | "), ins.hook || "", ins.opportunity || "",
    ];
  });
  downloadRows(headers, rows, `${eventName.replace(/[^a-z0-9]/gi, "_").toLowerCase()}_insights.csv`);
}

const EVENT_STATUS_CFG = {
  past:     { label: "Happened",      color: "#6366f1", bg: "rgba(99,102,241,.12)"  },
  ongoing:  { label: "Happening Now", color: "#10b981", bg: "rgba(16,185,129,.12)"  },

};

/* ── Step 1 — Event Scanner ────────────────────────────────── */
function EventCard({ ev, selected, onSelect }) {
  const cfg = EVENT_STATUS_CFG[ev.status] || EVENT_STATUS_CFG.upcoming;
  const [recap,        setRecap]        = React.useState(null);
  const [recapLoading, setRecapLoading] = React.useState(false);
  const [recapError,   setRecapError]   = React.useState("");

  async function loadRecap(e) {
    e.stopPropagation();
    if (recap) { setRecap(null); return; }       // toggle off
    setRecapLoading(true); setRecapError("");
    try {
      const res = await fetch("/api/event-recap", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          event_name: ev.name,
          event_city: ev.city,
          event_date: ev.date,
          event_url:  ev.reference_url || "",
          openai_key: getOpenAIKey(),
        }),
      });
      if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(err.error||`HTTP ${res.status}`); }
      const data = await res.json();
      const parsed = parseJSON(data.choices[0].message.content);
      const obj = Array.isArray(parsed) ? parsed[0] : parsed;
      setRecap(obj);
    } catch(e) { setRecapError(e.message); }
    finally    { setRecapLoading(false); }
  }

  return (
    <div className={`event-card ${selected?"selected":""}`} onClick={onSelect}>
      <div className="event-card-badge">✓ Selected</div>

      {/* Status + manual badge row */}
      <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
        {ev.status && (
          <span style={{fontSize:11,fontWeight:700,padding:"2px 9px",borderRadius:999,
            color:cfg.color,background:cfg.bg}}>
            {cfg.label}
          </span>
        )}
        {ev._manual && (
          <span style={{fontSize:11,fontWeight:700,padding:"2px 9px",borderRadius:999,
            color:"#0ea5e9",background:"rgba(14,165,233,.12)"}}>
            📎 Added manually
          </span>
        )}
      </div>

      <div className="event-card-name">{ev.name}</div>
      <div className="event-meta">
        <span className="meta-chip">📅 {ev.date}</span>
        <span className="meta-chip">📍 {ev.city}</span>
      </div>
      <div className="event-agenda">{ev.agenda}</div>
      <div className="event-panels">
        {(ev.panels||[]).map((p,i) => (
          <div key={i} className="panel-tag">Panel: {p}</div>
        ))}
      </div>

      {/* Links row */}
      <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:8,alignItems:"center"}}>
        {ev.reference_url && (
          <a href={ev.reference_url} target="_blank" rel="noopener noreferrer"
            className="ref-link" onClick={e => e.stopPropagation()}>
            🔗 View Source
          </a>
        )}
        {ev.status === "past" && (
          <button className="recap-btn" onClick={loadRecap} disabled={recapLoading}>
            {recapLoading ? "Searching…" : recap ? "▲ Hide Recap" : "📋 What Happened?"}
          </button>
        )}
      </div>

      {/* Recap panel */}
      {recapError && (
        <div style={{fontSize:11,color:"#b91c1c",marginTop:6}}>⚠ {recapError}</div>
      )}
      {recap && (
        <div className="recap-panel" onClick={e => e.stopPropagation()}>
          <div className={recap.confirmed ? "recap-confirmed" : "recap-unconfirmed"}>
            {recap.confirmed ? "✅ Confirmed happened" : "⚠ Not yet confirmed"} — {recap.confirmation_note}
          </div>
          {recap.key_themes?.length > 0 && (
            <div className="recap-themes">
              {recap.key_themes.map((t,i) => (
                <span key={i} className="recap-theme-chip">{t}</span>
              ))}
            </div>
          )}
          {recap.highlights && (
            <div className="recap-text">{recap.highlights}</div>
          )}
        </div>
      )}
    </div>
  );
}

function Step1({ onNext }) {
  const [category,      setCategory]      = React.useState("");
  const [keywords,      setKeywords]      = React.useState("");
  const [events,        setEvents]        = React.useState([]);
  const [selected,      setSelected]      = React.useState(null);
  const [loading,       setLoading]       = React.useState(false);
  const [error,         setError]         = React.useState("");
  const [manualUrl,     setManualUrl]     = React.useState("");
  const [manualLoading, setManualLoading] = React.useState(false);
  const [manualError,   setManualError]   = React.useState("");

  async function scanEvents() {
    setLoading(true); setError(""); setEvents([]); setSelected(null);
    try {
      const res = await fetch("/api/search-events", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category, keywords, openai_key: getOpenAIKey() }),
      });
      if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error||`HTTP ${res.status}`); }
      const data = await res.json();
      setEvents(parseJSON(data.choices[0].message.content));
    } catch(e) { setError(e.message); }
    finally    { setLoading(false); }
  }

  async function addManualEvent() {
    setManualLoading(true); setManualError("");
    try {
      const res = await fetch("/api/scrape-event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: manualUrl.trim(), openai_key: getOpenAIKey() }),
      });
      if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error||`HTTP ${res.status}`); }
      const data = await res.json();
      const parsed = parseJSON(data.choices[0].message.content);
      const ev = Array.isArray(parsed) ? parsed[0] : parsed;
      ev.id = "manual_" + Date.now();
      ev._manual = true;
      setEvents(prev => [ev, ...prev]);
      setManualUrl("");
    } catch(e) { setManualError(e.message); }
    finally    { setManualLoading(false); }
  }

  return (
    <div className="panel">
      <div className="panel-title">Event Scanner</div>
      <div className="panel-sub">Real corporate events in India — past 7 days, ongoing, and next 14 days.</div>

      {/* ── Manual URL add ── */}
      <div className="manual-box">
        <label className="field-label">📎 Add Event by URL (LinkedIn, event site, news article)</label>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input className="text-input" style={{flex:1}}
            placeholder="Paste URL here — e.g. linkedin.com/posts/... or eventwebsite.com/agenda"
            value={manualUrl} onChange={e => setManualUrl(e.target.value)}
            onKeyDown={e => e.key==="Enter" && manualUrl.trim() && !manualLoading && addManualEvent()} />
          <button className="btn btn-outline"
            onClick={addManualEvent}
            disabled={!manualUrl.trim() || manualLoading}
            style={{whiteSpace:"nowrap"}}>
            {manualLoading ? "Extracting…" : "+ Extract Event"}
          </button>
        </div>
        {manualError && <div className="error-alert" style={{marginTop:8}}>⚠ {manualError}</div>}
        {manualLoading && <div style={{fontSize:12,color:"var(--text-3)",marginTop:6}}>
          Fetching page and extracting event details…
        </div>}
      </div>

      <div className="divider-label">— or search automatically —</div>

      <label className="field-label">Event Category</label>
      <div className="pills-wrap">
        {CATEGORIES.map(c => (
          <button key={c} className={`pill ${category===c?"selected":""}`}
            onClick={() => setCategory(c)}>{c}</button>
        ))}
      </div>

      <div className="field-wrap">
        <label className="field-label">Keywords (optional)</label>
        <input className="text-input"
          placeholder="e.g. employee wellness, diagnostics, health benefits"
          value={keywords} onChange={e => setKeywords(e.target.value)} />
      </div>

      {error && <div className="error-alert">⚠ {error}</div>}

      {!loading && (
        <button className="btn btn-primary" onClick={scanEvents} disabled={!category}>
          🌐 Find Real Events
        </button>
      )}

      {loading && <Spinner label="Searching real events — past 7 days, ongoing & next 14 days…" />}

      {events.length > 0 && (
        <>
          <div className="section-title" style={{marginTop:20}}>
            {events.length} Event{events.length>1?"s":""} — Select One
          </div>
          <div className="cards-grid">
            {events.map(ev => (
              <EventCard key={ev.id} ev={ev}
                selected={selected?.id===ev.id}
                onSelect={() => setSelected(ev)} />
            ))}
          </div>
          <div className="btn-row">
            <button className="btn btn-ghost btn-sm"
              onClick={() => { setEvents([]); setSelected(null); }}>
              ↺ Clear All
            </button>
            <button className="btn btn-primary"
              disabled={!selected} onClick={() => onNext(selected)}>
              Extract People →
            </button>
          </div>
        </>
      )}
    </div>
  );
}

/* ── Google Sign-In (Gmail send scope, client-side token flow) ── */

function useGoogleAuth() {
  const [token,     setToken]     = React.useState(null);
  const [email,     setEmail]     = React.useState("");
  const [signing,   setSigning]   = React.useState(false);
  const [authError, setAuthError] = React.useState("");
  const clientRef = React.useRef(null);

  React.useEffect(() => {
    if (!GOOGLE_CONFIGURED) return;
    let cancelled = false;
    function init() {
      if (cancelled) return;
      if (!window.google?.accounts?.oauth2) { setTimeout(init, 300); return; }
      clientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GMAIL_SEND_SCOPE,
        callback: async (resp) => {
          if (resp.error) { setAuthError(resp.error); setSigning(false); return; }
          setToken(resp.access_token);
          try {
            const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
              headers: { Authorization: `Bearer ${resp.access_token}` },
            });
            const info = await r.json();
            setEmail(info.email || "");
          } catch {}
          setSigning(false);
        },
      });
    }
    init();
    return () => { cancelled = true; };
  }, []);

  function signIn() {
    setAuthError(""); setSigning(true);
    if (!clientRef.current) { setAuthError("Google sign-in is still loading — try again in a moment"); setSigning(false); return; }
    clientRef.current.requestAccessToken({ prompt: "consent" });
  }
  function signOut() { setToken(null); setEmail(""); }

  return { token, email, signing, authError, signIn, signOut };
}

const APOLLO_STATUS_CFG = {
  verified:          { label:"✅ Verified",    color:"#10b981" },
  likely_to_engage:  { label:"✓ Likely",       color:"#10b981" },
  guessed:           { label:"🔍 Guessed",     color:"#f59e0b" },
  not_found:         { label:"❌ Not found",   color:"#b91c1c" },
  error:             { label:"⚠ Error",        color:"#b91c1c" },
};

/* ── Step 4 — Bulk Email Composer (Gmail API) ─────────────────── */
function Step4({ event, people, insights, onBack }) {
  const google = useGoogleAuth();

  const [senderName,  setSenderName]  = React.useState("");
  const [senderRole,  setSenderRole]  = React.useState("");
  const [ccEmail,     setCcEmail]     = React.useState("");
  const [pitchAngle,  setPitchAngle]  = React.useState(PITCH_ANGLES[0]);
  const [testMode,    setTestMode]    = React.useState(true);
  const [attachFile,  setAttachFile]  = React.useState(null);
  const [apolloKey,   setApolloKey]   = React.useState("");
  const [lookupBusy,  setLookupBusy]  = React.useState(false);

  const [recipientMap, setRecipientMap] = React.useState(() =>
    Object.fromEntries(people.map(p => [p.id, { email: p.email_hint || "", included: true, apolloStatus: null }]))
  );

  const [bulkStep, setBulkStep] = React.useState("config"); // "config" | "preview" | "done"
  const [previews, setPreviews] = React.useState({});
  const [expanded, setExpanded] = React.useState({});
  const [loading,  setLoading]  = React.useState(false);
  const [error,    setError]    = React.useState("");
  const [results,  setResults]  = React.useState(null);

  function setRecipEmail(id, val) {
    setRecipientMap(m => ({ ...m, [id]: { ...m[id], email: val, apolloStatus: null } }));
  }
  function toggleIncluded(id) {
    setRecipientMap(m => ({ ...m, [id]: { ...m[id], included: !m[id].included } }));
  }
  function toggleAll(val) {
    setRecipientMap(m => Object.fromEntries(Object.entries(m).map(([k,v]) => [k, { ...v, included: val }])));
  }
  function setPreviewBody(id, val) {
    setPreviews(p => ({ ...p, [id]: { ...p[id], editedBody: val } }));
  }

  const includedPeople = people.filter(p => recipientMap[p.id]?.included);
  const allChecked     = includedPeople.length === people.length;
  const missingEmail   = includedPeople.filter(p => !(recipientMap[p.id]?.email||"").trim()).length;

  async function readFileAsB64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result.split(",")[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function findViaApollo() {
    if (!apolloKey.trim()) { setError("Enter your Apollo API key first"); return; }
    setLookupBusy(true); setError("");
    try {
      const toFind = includedPeople.map(p => ({ id: p.id, name: p.name, company: p.company, title: p.title }));
      const res = await fetch("/api/find-emails", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ apollo_key: apolloKey.trim(), people: toFind }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      setRecipientMap(m => {
        const next = { ...m };
        Object.entries(data.results).forEach(([id, r]) => {
          if (next[id]) {
            next[id] = { ...next[id], email: r.email || next[id].email, apolloStatus: r.status || (r.found ? "verified" : "not_found") };
          }
        });
        return next;
      });
    } catch(e) { setError(e.message); }
    finally    { setLookupBusy(false); }
  }

  async function generatePreviews() {
    setLoading(true); setError("");
    try {
      const enriched = includedPeople.map(p => ({ ...p, email_hint: (recipientMap[p.id]?.email || "").trim() }));
      const res = await fetch("/api/preview-bulk", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          event, people: enriched,
          insights:    insights.filter(ins => enriched.some(p => p.id === ins.id)),
          sender_name: senderName.trim() || "Redcliffe Labs",
          sender_role: senderRole.trim() || "Corporate Partnerships",
          pitch_angle: pitchAngle,
          openai_key:  getOpenAIKey(),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      const pvMap = {};
      Object.entries(data.previews).forEach(([id, pv]) => { pvMap[id] = { ...pv, editedBody: pv.body }; });
      setPreviews(pvMap);
      setBulkStep("preview");
    } catch(e) { setError(e.message); }
    finally    { setLoading(false); }
  }

  async function sendAll() {
    setLoading(true); setError("");
    try {
      if (!google.token) throw new Error("Sign in with Google first");
      let attachment_b64 = "", attachment_name = "";
      if (attachFile) {
        attachment_b64  = await readFileAsB64(attachFile);
        attachment_name = attachFile.name;
      }
      const enriched = includedPeople.map(p => ({ ...p, email_hint: (recipientMap[p.id]?.email || "").trim() }));
      const previewsToSend = Object.fromEntries(
        Object.entries(previews).map(([id, pv]) => [id, { subject: pv.subject, body: pv.editedBody || pv.body }])
      );
      const res = await fetch("/api/send-bulk", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_token: google.token, sender_email: google.email,
          sender_name:  senderName.trim() || "Redcliffe Labs",
          sender_role:  senderRole.trim() || "Corporate Partnerships",
          cc_email:     ccEmail.trim(),
          test_mode:    testMode, pitch_angle: pitchAngle,
          event, people: enriched,
          insights:     insights.filter(ins => enriched.some(p => p.id === ins.id)),
          previews:     previewsToSend,
          attachment_b64, attachment_name,
          openai_key:   getOpenAIKey(),
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) google.signOut();
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      setResults(data);
      setBulkStep("done");
    } catch(e) { setError(e.message); }
    finally    { setLoading(false); }
  }

  const canPreview = senderName.trim() && senderRole.trim() && includedPeople.length > 0;
  const canSend    = canPreview && !!google.token;

  if (!GOOGLE_CONFIGURED) {
    return (
      <div className="panel">
        <div className="panel-title">Email Composer</div>
        <div className="error-alert" style={{marginTop:12}}>
          ⚠ Google sign-in isn't configured yet. Set <code>GOOGLE_CLIENT_ID</code> near the top of this file
          to a real OAuth Client ID from Google Cloud Console (with the Gmail API enabled and this page's
          origin added as an authorized JavaScript origin) to enable sending.
        </div>
        <div className="btn-row"><button className="btn btn-ghost btn-sm" onClick={onBack}>← Back</button></div>
      </div>
    );
  }

  return (
    <div className="panel">
      <div className="panel-title">Email Composer</div>
      <div className="panel-sub">
        Personalised pitch emails referencing <strong>{event.name}</strong>, sent from your own Gmail via Google sign-in.
      </div>

      {/* ════════════════ STEP: config ════════════════ */}
      {bulkStep === "config" && (
        <>
          <div className="info-note" style={{marginBottom:18}}>
            📨 <strong>Step 1 of 3:</strong> Sign in with Google, configure your message, then preview before sending.
          </div>

          {/* Google sign-in */}
          <div className="field-wrap">
            <label className="field-label">Send As</label>
            {google.token ? (
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <span style={{fontSize:13,fontWeight:600,color:"var(--success)"}}>✓ Signed in as {google.email || "…"}</span>
                <button className="btn btn-ghost btn-sm" onClick={google.signOut}>Sign out</button>
              </div>
            ) : (
              <div>
                <button className="btn btn-outline btn-sm" onClick={google.signIn} disabled={google.signing}>
                  {google.signing ? "Opening Google sign-in…" : "🔐 Sign in with Google"}
                </button>
                {google.authError && <div style={{fontSize:12,color:"#b91c1c",marginTop:6}}>⚠ {google.authError}</div>}
              </div>
            )}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div className="field-wrap" style={{marginBottom:0}}>
              <label className="field-label">Your Name</label>
              <input className="text-input" placeholder="e.g. Nikhil Sharma"
                value={senderName} onChange={e => setSenderName(e.target.value)} />
            </div>
            <div className="field-wrap" style={{marginBottom:0}}>
              <label className="field-label">Your Role</label>
              <input className="text-input" placeholder="e.g. Corporate Partnerships Lead"
                value={senderRole} onChange={e => setSenderRole(e.target.value)} />
            </div>
            <div className="field-wrap" style={{marginBottom:0,gridColumn:"1 / -1"}}>
              <label className="field-label">CC (optional)</label>
              <input className="text-input" placeholder="e.g. manager@redcliffelabs.com"
                value={ccEmail} onChange={e => setCcEmail(e.target.value)} />
            </div>
          </div>

          <div className="field-wrap">
            <label className="field-label">Pitch Angle</label>
            <div className="pills-wrap">
              {PITCH_ANGLES.map(a => (
                <button key={a} className={`pill ${pitchAngle===a?"selected":""}`}
                  onClick={() => setPitchAngle(a)}>{a}</button>
              ))}
            </div>
          </div>

          <div className="field-wrap">
            <label className="field-label">Attachment (optional)</label>
            <label className="attach-label">
              📎 {attachFile ? attachFile.name : "Click to add PDF brochure / deck"}
              <input type="file" style={{display:"none"}} accept=".pdf,.pptx,.docx,.jpg,.png"
                onChange={e => setAttachFile(e.target.files[0]||null)} />
            </label>
            {attachFile && (
              <div className="attach-chosen">
                ✓ {attachFile.name} ({(attachFile.size/1024).toFixed(0)} KB)
                <button onClick={() => setAttachFile(null)}
                  style={{marginLeft:8,border:"none",background:"none",color:"#b91c1c",cursor:"pointer",fontSize:12}}>✕</button>
              </div>
            )}
          </div>

          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18,
                       padding:"11px 14px",background:"var(--surface-2)",
                       border:"1px solid var(--border)",borderRadius:"var(--radius-sm)"}}>
            <input type="checkbox" id="tm2" checked={testMode}
              onChange={e => setTestMode(e.target.checked)} style={{width:16,height:16,cursor:"pointer"}} />
            <label htmlFor="tm2" style={{cursor:"pointer",flex:1}}>
              <span style={{fontWeight:600,fontSize:13}}>
                Test Mode {testMode && <span className="test-badge">🧪 ON</span>}
              </span>
              <div style={{fontSize:12,color:"var(--text-2)",marginTop:1}}>
                {testMode
                  ? `All emails → YOUR inbox (${google.email||"your Gmail"}) so you can review before real send.`
                  : "⚠ Real Mode — emails go to the actual speaker addresses."}
              </div>
            </label>
          </div>

          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6,flexWrap:"wrap",gap:8}}>
            <div className="section-title" style={{marginBottom:0}}>
              Recipients — {includedPeople.length}/{people.length} selected
              {missingEmail > 0 && <span style={{marginLeft:8,fontSize:11,color:"#b45309",fontWeight:500}}>⚠ {missingEmail} missing email</span>}
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <button className="btn btn-ghost btn-sm" style={{padding:"4px 8px",fontSize:11}} onClick={() => toggleAll(true)}>All</button>
              <button className="btn btn-ghost btn-sm" style={{padding:"4px 8px",fontSize:11}} onClick={() => toggleAll(false)}>None</button>
            </div>
          </div>

          {/* Apollo key + find button */}
          <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
            <input className="text-input" style={{flex:1,minWidth:200,fontSize:12}}
              type="password" placeholder="Apollo API key (for verified emails) — get free at apollo.io"
              value={apolloKey} onChange={e => setApolloKey(e.target.value)} />
            <button className="btn btn-outline btn-sm"
              disabled={!apolloKey.trim() || lookupBusy || includedPeople.length===0}
              onClick={findViaApollo} style={{whiteSpace:"nowrap"}}>
              {lookupBusy ? "Searching…" : `🔍 Find Emails (${includedPeople.length} selected)`}
            </button>
          </div>

          <div style={{border:"1.5px solid var(--border)",borderRadius:"var(--radius-sm)",overflow:"auto"}}>
            <table className="bulk-table" style={{margin:0}}>
              <thead>
                <tr>
                  <th style={{width:34,textAlign:"center"}}>
                    <input type="checkbox" checked={allChecked}
                      onChange={e => toggleAll(e.target.checked)} style={{cursor:"pointer"}} />
                  </th>
                  <th>Name · Company</th>
                  <th style={{minWidth:230}}>
                    Email
                    <span style={{marginLeft:5,fontSize:10,color:"var(--text-3)",fontWeight:400,textTransform:"none"}}>
                      edit / paste address
                    </span>
                  </th>
                  <th style={{width:100}}>Status</th>
                </tr>
              </thead>
              <tbody>
                {people.map((p,i) => {
                  const rec      = recipientMap[p.id] || {};
                  const included = rec.included !== false;
                  const emailVal = rec.email || "";
                  const isEmpty  = !emailVal.trim();
                  const ast      = rec.apolloStatus;
                  const astCfg   = ast ? (APOLLO_STATUS_CFG[ast] || APOLLO_STATUS_CFG.not_found) : null;
                  return (
                    <tr key={p.id} style={{opacity:included?1:0.4,background:included?"":"var(--surface-2)"}}>
                      <td style={{textAlign:"center"}}>
                        <input type="checkbox" checked={included}
                          onChange={() => toggleIncluded(p.id)} style={{cursor:"pointer"}} />
                      </td>
                      <td>
                        <div style={{display:"flex",alignItems:"center",gap:7}}>
                          <div className="avatar" style={{width:26,height:26,fontSize:11,borderRadius:6,flexShrink:0,
                            background:AVATAR_COLORS[i%AVATAR_COLORS.length]}}>
                            {getInitials(p.name)}
                          </div>
                          <div>
                            <div style={{fontWeight:600,fontSize:12,lineHeight:1.3}}>{p.name}</div>
                            <div style={{fontSize:11,color:"var(--primary)"}}>{p.company}</div>
                          </div>
                        </div>
                      </td>
                      <td>
                        <input type="email" value={emailVal}
                          placeholder="paste or type email…"
                          onChange={e => setRecipEmail(p.id, e.target.value)}
                          style={{width:"100%",padding:"4px 8px",
                            border:`1.5px solid ${isEmpty&&included?"#fca5a5":"var(--border)"}`,
                            borderRadius:5,background:"var(--surface)",color:"var(--text)",
                            fontSize:12,fontFamily:"monospace",outline:"none"}}
                          onFocus={e=>e.target.style.borderColor="var(--primary)"}
                          onBlur={e=>e.target.style.borderColor=isEmpty&&included?"#fca5a5":"var(--border)"}
                        />
                      </td>
                      <td style={{fontSize:11,fontWeight:600,color:astCfg?.color||"var(--text-3)"}}>
                        {astCfg ? astCfg.label : (emailVal ? "✏ Manual" : "—")}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:11,color:"var(--text-3)",marginTop:5}}>
            💡 Red border = missing email. Apollo finds verified addresses — only charges credits for selected people.
          </div>

          {error && <div className="error-alert" style={{marginTop:12}}>⚠ {error}</div>}
          {loading && <Spinner label="Generating email previews…" />}

          {!loading && (
            <div className="btn-row">
              <button className="btn btn-ghost btn-sm" onClick={onBack}>← Back</button>
              <button className="btn btn-primary" disabled={!canPreview} onClick={generatePreviews}>
                👁 Preview Emails ({includedPeople.length}) →
              </button>
            </div>
          )}
        </>
      )}

      {/* ════════════════ STEP: preview ════════════════ */}
      {bulkStep === "preview" && (
        <>
          <div className="info-note" style={{marginBottom:16}}>
            👁 <strong>Step 2 of 3:</strong> Review every email below. Click to expand, edit the body if needed, then send.
            {testMode && <span className="test-badge" style={{marginLeft:8}}>🧪 Test Mode ON</span>}
          </div>

          {includedPeople.map((p,i) => {
            const pv   = previews[p.id] || {};
            const open = expanded[p.id];
            const rec  = recipientMap[p.id] || {};
            return (
              <div key={p.id} style={{border:"1.5px solid var(--border)",borderRadius:"var(--radius-sm)",
                                       marginBottom:8,overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
                             background:"var(--surface-2)",cursor:"pointer"}}
                  onClick={() => setExpanded(e => ({...e, [p.id]: !e[p.id]}))}>
                  <div className="avatar" style={{width:28,height:28,fontSize:11,borderRadius:7,flexShrink:0,
                    background:AVATAR_COLORS[i%AVATAR_COLORS.length]}}>
                    {getInitials(p.name)}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13}}>{p.name}
                      <span style={{fontWeight:400,color:"var(--text-3)",marginLeft:6,fontSize:12}}>
                        → {rec.email||"no email"}
                      </span>
                    </div>
                    <div style={{fontSize:12,color:"var(--text-3)",overflow:"hidden",
                                 textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {pv.subject||"—"}
                    </div>
                  </div>
                  <span style={{fontSize:18,color:"var(--text-3)",flexShrink:0}}>{open?"▲":"▼"}</span>
                </div>

                {open && (
                  <div style={{padding:"12px 14px",borderTop:"1px solid var(--border)"}}>
                    <div style={{fontSize:11,fontWeight:700,color:"var(--text-3)",
                                 textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Subject</div>
                    <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>{pv.subject}</div>
                    <div style={{fontSize:11,fontWeight:700,color:"var(--text-3)",
                                 textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>
                      Body <span style={{fontWeight:400,textTransform:"none",fontSize:11}}>(editable)</span>
                    </div>
                    <textarea
                      value={pv.editedBody || pv.body || ""}
                      onChange={e => setPreviewBody(p.id, e.target.value)}
                      style={{width:"100%",minHeight:160,padding:"10px 12px",
                              border:"1.5px solid var(--border)",borderRadius:6,
                              background:"var(--surface)",color:"var(--text)",
                              fontSize:13,fontFamily:"inherit",lineHeight:1.65,
                              resize:"vertical",outline:"none"}}
                      onFocus={e=>e.target.style.borderColor="var(--primary)"}
                      onBlur={e=>e.target.style.borderColor="var(--border)"}
                    />
                  </div>
                )}
              </div>
            );
          })}

          {error && <div className="error-alert" style={{marginTop:12}}>⚠ {error}</div>}
          {loading && <Spinner label={`Sending ${includedPeople.length} emails…`} />}

          {!loading && (
            <div className="btn-row">
              <button className="btn btn-ghost btn-sm" onClick={() => setBulkStep("config")}>← Edit Recipients</button>
              <button className="btn btn-primary" disabled={!canSend} onClick={sendAll}>
                {testMode
                  ? `🧪 Send Test (${includedPeople.length} → my inbox)`
                  : `📨 Send for Real (${includedPeople.length} emails)`}
              </button>
            </div>
          )}
        </>
      )}

      {/* ════════════════ STEP: done ════════════════ */}
      {bulkStep === "done" && results && (
        <>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
            <span style={{fontWeight:700,fontSize:15}}>
              ✅ {results.sent}/{results.total} sent
              {results.test_mode && <span className="test-badge" style={{marginLeft:8}}>🧪 Test Mode</span>}
            </span>
            {results.failed > 0 && <span style={{fontSize:13,color:"#b91c1c"}}>{results.failed} failed</span>}
          </div>
          <table className="bulk-table">
            <thead><tr><th>Name</th><th>Sent To</th><th>Subject</th><th>Status</th></tr></thead>
            <tbody>
              {results.results.map((r,i) => (
                <tr key={i}>
                  <td style={{fontWeight:600}}>{r.name}</td>
                  <td style={{fontSize:11,color:"var(--text-3)",fontFamily:"monospace"}}>{r.sent_to||"—"}</td>
                  <td style={{fontSize:12,color:"var(--text-2)",maxWidth:200,overflow:"hidden",
                              textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.subject||"—"}</td>
                  <td>
                    <span className={`status-dot ${r.status}`}>
                      {r.status==="sent"?"✅ Sent":r.status==="skipped"?"⏭ Skipped":r.status==="error"?"❌ Error":r.status}
                    </span>
                    {r.reason && <div style={{fontSize:11,color:"var(--text-3)",marginTop:2}}>{r.reason}</div>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="btn-row">
            <button className="btn btn-ghost btn-sm" onClick={() => { setBulkStep("config"); setResults(null); }}>
              ↺ Start Over
            </button>
            {results.test_mode && (
              <button className="btn btn-primary" onClick={() => { setTestMode(false); setBulkStep("preview"); }}>
                📨 Send for Real →
              </button>
            )}
          </div>
        </>
      )}
    </div>
  );
}

/* ── OpenAI key field (header) ─────────────────────────────── */
function OpenAIKeyField() {
  const [key,   setKey]   = React.useState(getOpenAIKey());
  const [saved, setSaved] = React.useState(!!getOpenAIKey());

  function handleChange(e) {
    const v = e.target.value;
    setKey(v);
    setOpenAIKey(v.trim());
    setSaved(!!v.trim());
  }

  return (
    <div style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto"}}>
      <input
        className="text-input"
        style={{width:220,fontSize:12}}
        type="password"
        placeholder="Your OpenAI API key"
        value={key}
        onChange={handleChange}
        title="Stored only in your browser (localStorage) — sent to our server per-request to call OpenAI on your behalf."
      />
      <span style={{fontSize:11,fontWeight:600,color: saved ? "#10b981" : "#94a3b8",whiteSpace:"nowrap"}}>
        {saved ? "● key set" : "○ no key"}
      </span>
    </div>
  );
}

/* ── App ───────────────────────────────────────────────────── */
function App() {
  const [step,     setStep]     = React.useState(0);
  const [event,    setEvent]    = React.useState(null);
  const [people,   setPeople]   = React.useState([]);
  const [insights, setInsights] = React.useState([]);

  return (
    <div>
      <header className="header">
        <div className="header-logo">RL</div>
        <div>
          <div className="header-title">Redcliffe Labs — Event Intelligence</div>
          <div className="header-sub">AI-powered corporate outreach pipeline</div>
        </div>
        <OpenAIKeyField />
      </header>

      <main className="main">
        <ProgressBar current={step} />

        {step === 0 && (
          <Step1 onNext={ev => { setEvent(ev); setStep(1); }} />
        )}
        {step === 1 && event && (
          <Step2
            event={event}
            onNext={pp => { setPeople(pp); setStep(2); }}
            onBack={() => setStep(0)}
          />
        )}
        {step === 2 && event && people.length > 0 && (
          <Step3
            event={event}
            people={people}
            onNext={ins => { setInsights(ins); setStep(3); }}
            onBack={() => setStep(1)}
          />
        )}
        {step === 3 && event && people.length > 0 && insights.length > 0 && (
          <Step4
            event={event}
            people={people}
            insights={insights}
            onBack={() => setStep(2)}
          />
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
