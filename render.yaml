services:
  - type: web
    name: redcliffe-outreach
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300 --graceful-timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
